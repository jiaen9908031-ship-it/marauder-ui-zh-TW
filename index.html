<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ESP32 Marauder 裝置的繁體中文網頁介面，可透過 Web Serial API 連線。">
    <title>marauder-ui｜Wi-Fi Marauder 網頁介面</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <main style="max-width: 720px; margin: 12vh auto; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.6; color: #222;">
        <h1>網頁尚未成功載入</h1>
        <p>如果這段提示一直顯示，代表網頁程式尚未啟動。</p>
        <p>請到 GitHub 儲存庫的 <strong>Settings → Pages → Build and deployment</strong>，將 <strong>Source</strong> 設為 <strong>GitHub Actions</strong>，並確認 <strong>Actions</strong> 分頁中的部署工作流程成功完成。</p>
        <p>這是 Vite 網頁專案，不能直接用 GitHub Pages 的「Deploy from a branch」方式發布原始碼。</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
